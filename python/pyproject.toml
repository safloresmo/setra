[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "setra"
version = "0.1.0"
description = "Bloques de control: PID, filtros, perfiles de movimiento y modelos de plantas"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
ejemplos = ["matplotlib"]
pruebas = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
