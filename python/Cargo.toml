[package]
name = "setra-python"
version = "0.1.0"
edition = "2024"
description = "Módulo de Python de setra"
license = "MIT"
publish = false

[lib]
name = "setra"
crate-type = ["cdylib"]

[dependencies]
nucleo = { package = "setra", path = "..", features = ["f64"] }
pyo3 = { version = "0.29", features = ["abi3-py310"] }

# Se compila aparte del núcleo: este paquete necesita Python y `f64`.
[workspace]
